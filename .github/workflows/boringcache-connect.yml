name: Connect BoringCache

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connect:
    name: Connect GitHub OIDC
    if: github.repository == 'boringcache/dot-agent-deck' && github.ref == 'refs/heads/boringcache-validation'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install released BoringCache
        run: |
          curl -fsSL https://install.boringcache.com/install.sh -o "$RUNNER_TEMP/install-boringcache.sh"
          sh "$RUNNER_TEMP/install-boringcache.sh"
          printf '%s/.local/bin\n' "$HOME" >> "$GITHUB_PATH"
      - name: Connect repository
        run: boringcache ci connect --oidc-provider github-actions
