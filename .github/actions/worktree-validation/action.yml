name: Validate fresh Rust worktrees
description: Run the existing workspace gates in an independent worktree and target directory.
inputs:
  phase:
    description: Measurement phase
    required: true
  provider:
    description: No cache or BoringCache
    required: true
  source:
    description: Optional captured upstream commit
    default: ''
  cli_version:
    description: Optional exact BoringCache CLI release or prerelease
    default: ''
runs:
  using: composite
  steps:
    - name: Create independent source worktree
      shell: bash
      env:
        PHASE: ${{ inputs.phase }}
        SOURCE_OVERRIDE: ${{ inputs.source }}
      run: |
        source_commit=${SOURCE_OVERRIDE:-$(cat .github/boringcache-source)}
        worktree="$(dirname "$GITHUB_WORKSPACE")/dot-$PHASE-${source_commit:0:12}"
        evidence="$RUNNER_TEMP/validation-$PHASE"
        mkdir -p "$evidence"
        git worktree add -b "cache-$PHASE" "$worktree" "$source_commit"
        cp .boringcache.toml "$worktree/.boringcache.toml"
        test ! -e "$worktree/target"
        printf 'VALIDATION_WORKTREE=%s\nVALIDATION_EVIDENCE=%s\n' "$worktree" "$evidence" >> "$GITHUB_ENV"
        printf '%s\n' "$source_commit" > "$evidence/upstream-commit.txt"
        git rev-parse HEAD > "$evidence/validation-commit.txt"
        git -C "$worktree" status --short > "$evidence/initial-worktree-status.txt"
        printf '0\n' > "$evidence/initial-target-files.txt"
        uname -a > "$evidence/runner.txt"
        lscpu > "$evidence/lscpu.txt"
        df -h "$worktree" > "$evidence/disk-before.txt"
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
      with:
        toolchain: 1.97.1
        components: clippy, rustfmt
    - name: Install nextest and sccache
      uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2
      with:
        tool: cargo-nextest@0.9.143,sccache@0.17.0
    - name: Install upstream Linux desktop dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
          libayatana-appindicator3-dev librsvg2-dev libxdo-dev
    - name: Record toolchain
      shell: bash
      run: |
        rustc -Vv > "$VALIDATION_EVIDENCE/rustc.txt"
        cargo nextest --version > "$VALIDATION_EVIDENCE/nextest.txt"
        sccache --version > "$VALIDATION_EVIDENCE/sccache-version.txt"
    - name: Start shared compiler cache
      id: cache
      if: inputs.provider == 'BoringCache'
      uses: boringcache/one@a610ec5a564efd9b360925056dbade04deb5def6 # v1.30.0
      with:
        cli-version: ${{ inputs.cli_version }}
        working-directory: ${{ env.VALIDATION_WORKTREE }}
        mode: sccache
        trust-policy: ${{ (inputs.phase == 'cold' || inputs.phase == 'commit') && 'publish' || 'restore' }}
        fail-on-cache-error: true
        fail-on-cache-miss: ${{ inputs.phase != 'cold' }}
    - name: Record the native compiler-cache plan
      if: inputs.provider == 'BoringCache'
      shell: bash
      working-directory: ${{ env.VALIDATION_WORKTREE }}
      run: boringcache sccache --dry-run --json > "$VALIDATION_EVIDENCE/compiler-plan.json"
    - name: Run workspace gates
      shell: bash
      working-directory: ${{ env.VALIDATION_WORKTREE }}
      env:
        PROVIDER: ${{ inputs.provider }}
        CARGO_INCREMENTAL: '0'
      run: bash "$GITHUB_WORKSPACE/.github/worktree-validation.sh"
    - name: Retain native compiler statistics
      if: always() && inputs.provider == 'BoringCache'
      shell: bash
      run: sccache --show-stats --stats-format=json > "$VALIDATION_EVIDENCE/sccache-final.json"
    - name: Retain validation evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.provider }}-${{ inputs.phase }}-${{ github.run_id }}-${{ github.run_attempt }}
        include-hidden-files: true
        path: |
          ${{ env.VALIDATION_EVIDENCE }}
          ${{ steps.cache.outputs.evidence-path }}
          ${{ env.VALIDATION_WORKTREE }}/target/nextest/default/junit.xml
        retention-days: 30
        if-no-files-found: error
